name: sd-commerce

x-app: &app
  build: .
  env_file: .env
  environment: &app-env
    DJANGO_SETTINGS_MODULE: config.settings.production
    # The `app` user has no home; give gunicorn 26's control server a writable
    # HOME so it stops logging "Permission denied: '/nonexistent'".
    HOME: /app
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
    DJANGO_TRUST_PROXY_HEADERS: "1"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdcommerce}
      POSTGRES_USER: ${POSTGRES_USER:-sdcommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdcommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    <<: *app
    environment:
      <<: *app-env
      # Real concurrency = workers * threads. Tune per box; keep workers small
      # on a shared VPS (each is a full Django + Pillow process).
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    volumes:
      # MEDIA_DIR (host path) makes uploads readable by an nginx running on the
      # host. Unset -> the named volume (only the container can read it, so
      # nginx would have to proxy /media/ back to the app).
      - ${MEDIA_DIR:-media}:/app/media
    # Default publishes on all interfaces. Once nginx fronts the app, set
    # WEB_BIND=127.0.0.1 in .env so the container is only reachable through it.
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8000}:8000"

  worker:
    <<: *app
    # `nice` yields CPU to the web process under load. One worker drains both the
    # default queue and the low-priority `images` queue (image tasks are
    # rate-limited in settings, so they stay a background trickle).
    command: ["nice", "-n", "12", "celery", "-A", "config", "worker", "-l", "info",
              "-Q", "celery,images",
              "--concurrency", "${CELERY_CONCURRENCY:-2}",
              "--prefetch-multiplier", "1",
              "--max-tasks-per-child", "40"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    volumes:
      - ${MEDIA_DIR:-media}:/app/media
    # The image HEALTHCHECK curls /healthz/ — right for `web`, meaningless for a
    # worker (no HTTP server). Ask Celery itself whether the worker is up.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -t 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    # `celery beat` is a bare scheduler — no HTTP server, and it does not answer
    # `inspect ping` (that's a worker control command). The image HEALTHCHECK
    # can only ever fail here; disable it and rely on `restart: unless-stopped`
    # (the container exits if the beat process dies).
    healthcheck:
      disable: true

  # Scheduled pg_dump with daily/weekly/monthly retention -> pgbackups volume.
  # On-demand:  docker compose exec pgbackup /backup.sh
  # Restore:    docker compose exec -T db psql -U <user> -d <db> < <(gunzip -c backup.sql.gz)
  pgbackup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-sdcommerce}
      POSTGRES_USER: ${POSTGRES_USER:-sdcommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      HEALTHCHECK_PORT: 8080
    volumes:
      - pgbackups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media:
  pgbackups:
