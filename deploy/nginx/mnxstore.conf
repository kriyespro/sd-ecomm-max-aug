# /etc/nginx/sites-available/mnxstore.conf
# ln -s /etc/nginx/sites-available/mnxstore.conf /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx
#
# The Django "web" container publishes on 127.0.0.1:8888 (WEB_PORT in .env).
# WhiteNoise serves /static/ from inside the app, so nginx only reverse-proxies.
# Media files are served straight off the mounted volume for speed.

upstream sdcommerce {
    server 127.0.0.1:8888;
    keepalive 16;
}

# ---- known hosts: the platform domain + every store subdomain --------------
server {
    listen 80;
    listen [::]:80;
    server_name mnxstore.com www.mnxstore.com *.mnxstore.com 159.195.57.98;

    # Skin .zip uploads are capped at 30 MB app-side; give headroom.
    client_max_body_size 32m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/javascript text/xml application/xml
               application/rss+xml image/svg+xml font/ttf font/otf font/woff font/woff2;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot -w /var/www/certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uploaded media. Requires MEDIA_DIR=/srv/mnx/media in .env (host bind mount)
    # so nginx can read the files; if a file is missing, fall through to the app.
    location /media/ {
        alias /srv/mnx/media/;
        try_files $uri @app;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location @app {
        proxy_pass         http://sdcommerce;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location / {
        proxy_pass         http://sdcommerce;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_redirect     off;
    }
}

# ---- anything else: drop the connection -----------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ==========================================================================
#  AFTER TLS  (certbot --nginx -d mnxstore.com -d www.mnxstore.com \
#              -d '*.mnxstore.com' via DNS-01, or list each subdomain)
#  certbot rewrites the :80 block to add :443 + redirect. Then in .env set
#  DJANGO_SECURE_SSL_REDIRECT=true and `docker compose up -d web worker beat`.
# ==========================================================================
