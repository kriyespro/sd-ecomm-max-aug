# /etc/nginx/sites-available/mnxstore.conf  (TLS version)
# Swap to this ONLY after the cert exists:
#   /etc/letsencrypt/live/mnxstore.com/fullchain.pem
# Then:  nginx -t && systemctl reload nginx

upstream sdcommerce {
    server 127.0.0.1:8888;
    keepalive 16;
}

# ---- HTTP: ACME challenge + redirect everything else to HTTPS -------------
server {
    listen 80;
    listen [::]:80;
    server_name mnxstore.com www.mnxstore.com *.mnxstore.com 159.195.57.98;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS ---------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mnxstore.com www.mnxstore.com *.mnxstore.com 159.195.57.98;

    ssl_certificate     /etc/letsencrypt/live/mnxstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mnxstore.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    client_max_body_size 32m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/javascript text/xml application/xml
               application/rss+xml image/svg+xml font/ttf font/otf font/woff font/woff2;

    # Needs MEDIA_DIR=/srv/mnx/media in .env (host bind mount); missing files
    # fall through to the app.
    location /media/ {
        alias /srv/mnx/media/;
        try_files $uri @app;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location @app {
        proxy_pass         http://sdcommerce;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";
    }

    location / {
        proxy_pass         http://sdcommerce;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_redirect     off;
    }
}

# ---- unknown Host: drop -------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/mnxstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mnxstore.com/privkey.pem;
    return 444;
}
