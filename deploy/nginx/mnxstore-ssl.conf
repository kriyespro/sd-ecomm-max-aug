# /etc/nginx/sites-available/mnxstore.conf  (TLS version)
#
# Uses a Cloudflare Origin CA certificate (not Let's Encrypt): create it in the
# CF dashboard (SSL/TLS -> Origin Server -> Create Certificate) for
#   mnxstore.com, *.mnxstore.com
# and save it on the server as:
#   /etc/nginx/ssl/cf-origin.pem   (certificate)
#   /etc/nginx/ssl/cf-origin.key   (private key, chmod 600)
# Set Cloudflare SSL/TLS mode to "Full (strict)" — CF trusts its own Origin CA
# for every proxied hostname, including customer domains in other CF accounts,
# so this one cert serves all of them.
#
# Install:
#   sudo cp deploy/nginx/mnxstore-ssl.conf /etc/nginx/sites-available/mnxstore.conf
#   sudo nginx -t && sudo systemctl reload nginx

upstream sdcommerce {
    server 127.0.0.1:8888;
    keepalive 16;
}

# ---- HTTP: redirect everything to HTTPS ----------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS: one block serves the platform AND every verified custom domain
#      Any Host is proxied to the app; Django resolves the store from the Host
#      (verified Domain row or primary_domain) and 404s if none matches.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cf-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cf-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 32m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/javascript text/xml application/xml
               application/rss+xml image/svg+xml font/ttf font/otf font/woff font/woff2;

    # Uploaded media straight off disk (needs MEDIA_DIR=/srv/mnx/media in .env).
    location /media/ {
        alias /srv/mnx/media/;
        try_files $uri @app;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location @app {
        proxy_pass         http://sdcommerce;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
    }

    location / {
        proxy_pass         http://sdcommerce;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_redirect     off;
    }
}
