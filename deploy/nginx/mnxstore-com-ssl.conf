# /etc/nginx/sites-available/mnxstore-com.conf  (TLS, second isolated platform)
#
# Second, fully separate deployment of the SAME codebase, own DB/containers,
# serving mnxstore.com. Zero shared data with the shopinaday.com stack — this
# is NOT the multi-brand feature (that shares one DB). See deploy/nginx/mnxstore-ssl.conf
# for the shopinaday.com block already live on this box (listen 443 default_server) —
# this file adds a second, explicit server_name block alongside it. nginx matches
# the most specific server_name first, so this never steals shopinaday.com traffic
# and the existing default_server block never steals mnxstore.com traffic.
#
# Cloudflare Origin CA cert: REUSES the cert already on this box at
# /etc/nginx/ssl/cf-origin.{pem,key} (created 2026-08-29, hostnames
# mnxstore.com + *.mnxstore.com — issued back when mnxstore.com was the
# platform apex). shopinaday.com's nginx block has been borrowing this same
# cert file too (CF trusts its own Origin CA for any proxied host), but this
# cert's actual hostnames match mnxstore.com exactly, so this block is its
# correct, intended use. Do NOT revoke/remove it in the Cloudflare dashboard —
# that would break shopinaday.com's live HTTPS, which depends on the same
# file right now. No new cert needed.
# Cloudflare SSL/TLS mode: Full (strict).
#
# Install:
#   sudo cp deploy/nginx/mnxstore-com-ssl.conf /etc/nginx/sites-available/mnxstore-com.conf
#   sudo ln -s /etc/nginx/sites-available/mnxstore-com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires the mnxstore app stack running on 127.0.0.1:8889 (WEB_PORT in its
# own .env — see .env.mnxstore.example), started as its own compose project:
#   cd ~/apps/mnxstore && docker compose -p mnxstore up -d

upstream mnxstore_app {
    server 127.0.0.1:8889;
    keepalive 16;
}

# ---- HTTP: redirect everything on this host to HTTPS ----------------------
server {
    listen 80;
    listen [::]:80;
    server_name mnxstore.com www.mnxstore.com *.mnxstore.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS: platform apex + every mnxstore.com store subdomain ------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mnxstore.com www.mnxstore.com *.mnxstore.com;

    ssl_certificate     /etc/nginx/ssl/cf-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cf-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 32m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/javascript text/xml application/xml
               application/rss+xml image/svg+xml font/ttf font/otf font/woff font/woff2;

    # Uploaded media straight off disk. Needs MEDIA_DIR=/srv/mnxstore/media in
    # this stack's .env — a DIFFERENT path from shopinaday's /srv/mnx/media.
    location /media/ {
        alias /srv/mnxstore/media/;
        try_files $uri @app;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location @app {
        proxy_pass         http://mnxstore_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
    }

    # Backup restore uploads a big zip and rebuilds the store in one request.
    location ~ ^/admin/(backup/(restore/|snapshots/\d+/restore/)|stores/\d+/restore/|platform-backups/|platform-restore/) {
        client_max_body_size 700m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_pass         http://mnxstore_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_redirect     off;
    }

    location / {
        proxy_pass         http://mnxstore_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_redirect     off;
    }
}
